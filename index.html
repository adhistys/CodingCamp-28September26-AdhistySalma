<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Expense & Budget Visualizer</h1>
      <button id="theme-toggle" class="btn-ghost" type="button" aria-label="Toggle dark mode">🌓</button>
    </header>

    <section class="card balance">
      <span class="label">TOTAL BALANCE</span>
      <p id="total-balance" class="balance-value">$0.00</p>
    </section>

    <section class="card">
      <h2>Add Transaction</h2>
      <form id="transaction-form" novalidate>
        <label for="item-name">Item Name</label>
        <input type="text" id="item-name" placeholder="e.g. Lunch">

        <label for="amount">Amount</label>
        <input type="number" id="amount" placeholder="0.00" min="0" step="0.01">

        <label for="category">Category</label>
        <select id="category">
          <option value="">Select category</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Fun">Fun</option>
        </select>

        <p id="form-error" class="error" role="alert"></p>
        <button type="submit" class="btn-primary">Add Transaction</button>
      </form>
    </section>

    <section class="card">
      <div class="controls">
        <div>
          <label for="sort">Sort by</label>
          <select id="sort">
            <option value="newest">Newest</option>
            <option value="amount-desc">Amount (high → low)</option>
            <option value="amount-asc">Amount (low → high)</option>
            <option value="category">Category</option>
          </select>
        </div>
        <div>
          <label for="limit">Highlight above</label>
          <input type="number" id="limit" placeholder="Limit" min="0" step="0.01">
        </div>
      </div>
    </section>

    <div class="grid">
      <section class="card">
        <h2>Transactions</h2>
        <ul id="transaction-list" class="list"></ul>
        <p id="empty-msg" class="muted">No transactions yet.</p>
      </section>

      <section class="card">
        <h2>Spending by Category</h2>
        <div class="chart-wrap"><canvas id="chart"></canvas></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
